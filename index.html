<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>3D 瓶中微縮世界 — 海盜船與海洋</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="https://fonts.acghub.net/css?family=Fusion+Pixel" />
  <link rel="stylesheet" href="css/style.css" />
  <!-- Load Three.js engine immediately with zero network blocking (compatible with Three.js r128+ & WebGL2) -->
  <script src="js/three-offline-fallback.js"></script>
</head>
<body>
  <!-- 3D WebGL Viewport -->
  <div id="canvas-container"></div>

  <!-- Top Bar: Title & Quick Camera View Presets -->
  <header id="top-bar">
    <div class="brand-cluster">
      <div class="brand-badge">
        <h1>
          <span class="txt-long">SHIP IN A BOTTLE · 3D 瓶中微縮世界</span>
          <span class="txt-short">瓶中微縮世界</span>
        </h1>
        <p class="brand-sub">Voxel / Low-Poly Real-Time WebGL Diorama</p>
      </div>
      <nav class="social-links" aria-label="作者連結">
        <a class="social-btn" href="https://github.com/ReiKama414" target="_blank" rel="noopener noreferrer" title="GitHub · ReiKama414" aria-label="GitHub">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M12 2C6.48 2 2 6.58 2 12.26c0 4.52 2.87 8.35 6.84 9.71.5.1.68-.22.68-.48 0-.24-.01-.87-.01-1.71-2.78.62-3.37-1.37-3.37-1.37-.45-1.18-1.11-1.5-1.11-1.5-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.89 1.56 2.34 1.11 2.91.85.09-.66.35-1.11.63-1.37-2.22-.26-4.56-1.14-4.56-5.07 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.31.1-2.73 0 0 .84-.27 2.75 1.05A9.3 9.3 0 0 1 12 6.84c.85.01 1.71.12 2.51.34 1.91-1.32 2.75-1.05 2.75-1.05.55 1.42.2 2.47.1 2.73.64.72 1.03 1.63 1.03 2.75 0 3.94-2.34 4.8-4.57 5.06.36.32.68.94.68 1.9 0 1.37-.01 2.47-.01 2.81 0 .27.18.59.69.48A10.04 10.04 0 0 0 22 12.26C22 6.58 17.52 2 12 2z"/>
          </svg>
        </a>
        <a class="social-btn" href="https://reikama414.vercel.app/" target="_blank" rel="noopener noreferrer" title="Website · reikama414.vercel.app" aria-label="個人網站">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
            <path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm7.9 9h-3.17a15.4 15.4 0 0 0-1.3-5.1A8.03 8.03 0 0 1 19.9 11zM12 4c.9 0 2.3 1.7 3.1 5H8.9C9.7 5.7 11.1 4 12 4zM4.1 13h3.17c.2 1.9.7 3.6 1.3 5.1A8.03 8.03 0 0 1 4.1 13zm3.17-2H4.1a8.03 8.03 0 0 1 4.47-5.1A15.4 15.4 0 0 0 7.27 11zM12 20c-.9 0-2.3-1.7-3.1-5h6.2c-.8 3.3-2.2 5-3.1 5zm3.73-2.9c.6-1.5 1.1-3.2 1.3-5.1h3.17a8.03 8.03 0 0 1-4.47 5.1zM8.9 13h6.2c-.2 1.9-.7 3.6-1.3 5.05-.4.1-.8.15-1.2.15s-.8-.05-1.2-.15c-.6-1.45-1.1-3.15-1.3-5.05z"/>
          </svg>
        </a>
      </nav>
    </div>

    <div class="camera-bar" role="toolbar" aria-label="視角切換">
      <button class="cam-btn active" data-camera="front">正面全景</button>
      <button class="cam-btn" data-camera="ship"><span class="txt-long">海盜船特寫</span><span class="txt-short">海盜船</span></button>
      <button class="cam-btn" data-camera="lighthouse"><span class="txt-long">燈塔與瀑布</span><span class="txt-short">燈塔</span></button>
      <button class="cam-btn" data-camera="underwater"><span class="txt-long">海底珊瑚礁</span><span class="txt-short">海底</span></button>
      <button class="cam-btn" data-camera="neck"><span class="txt-long">瓶口視角</span><span class="txt-short">瓶口</span></button>
      <button class="cam-btn" id="btnSlowOrbit"><span class="txt-long">🎥 自動環繞</span><span class="txt-short">🎥 環繞</span></button>
      <button class="cam-btn" id="btnAudio"><span class="txt-long">🔇 海浪音效：關</span><span class="txt-short">🔇 音效</span></button>
    </div>
  </header>

  <!-- Bottom Nautical Parchment Interactive Dock -->
  <section id="ui-wrapper">
    <div class="helper-caption">
      <span class="hint-text">
        <span class="txt-long">點擊瓶中海面可投下許願石 · 拖曳畫面 360° 旋轉視角 · 滾輪或雙指縮放 · Drag to orbit · Tap sea to drop a pebble · Scroll/pinch to zoom</span>
        <span class="txt-short">點擊海面投石 · 拖曳旋轉 · 雙指縮放</span>
      </span>
      <button class="toggle-ui-btn" id="btnToggleUI">▼ 收合</button>
    </div>

    <div id="ui-dock">
      <!-- Row 1: Day/Night Time Slider + Weather Mode + Wave Intensity Slider -->
      <div class="dock-row">
        <div class="control-group grow">
          <span class="ctrl-label"><span class="txt-long">HOUR · 時間</span><span class="txt-short">時間</span></span>
          <input type="range" id="hourSlider" class="nautical-slider" min="0" max="24" step="0.05" value="11.27" />
          <span class="ctrl-value" id="hourDisplay">11:16</span>
          <button class="parch-btn" id="btnAutoTime" title="自動日夜循環">
            <span class="txt-long">日夜流轉 · Let the days pass</span>
            <span class="txt-short">日夜流轉</span>
          </button>
        </div>

        <div class="control-group">
          <span class="ctrl-label"><span class="txt-long">WEATHER · 天氣</span><span class="txt-short">天氣</span></span>
          <div class="btn-group">
            <button class="parch-btn active" data-weather="sunny"><span class="txt-long">☀ 晴天 CALM</span><span class="txt-short">☀ 晴天</span></button>
            <button class="parch-btn" data-weather="rainy"><span class="txt-long">🌧 雨天 BREEZE</span><span class="txt-short">🌧 雨天</span></button>
            <button class="parch-btn" data-weather="stormy"><span class="txt-long">⛈ 暴風雨 SQUALL</span><span class="txt-short">⛈ 暴風雨</span></button>
          </div>
        </div>

        <div class="control-group wave-group">
          <span class="ctrl-label"><span class="txt-long">WAVE · 海浪</span><span class="txt-short">海浪</span></span>
          <input type="range" id="waveSlider" class="nautical-slider wave-slider" min="0" max="100" step="1" value="42" />
        </div>
      </div>

      <!-- Row 2: Bottle Scene Switcher + Interactive Micro-Actions -->
      <div class="dock-row">
        <div class="control-group">
          <span class="ctrl-label"><span class="txt-long">SCENE · 場景</span><span class="txt-short">場景</span></span>
          <div class="btn-group">
            <button class="parch-btn active" data-scene="pirate"><span class="txt-long">🏴‍☠️ 海盜船與燈塔</span><span class="txt-short">🏴‍☠️ 海盜</span></button>
            <button class="parch-btn" data-scene="ghost"><span class="txt-long">👻 幽靈船與火山</span><span class="txt-short">👻 幽靈</span></button>
            <button class="parch-btn" data-scene="viking"><span class="txt-long">❄️ 極光與維京船</span><span class="txt-short">❄️ 極光</span></button>
            <button class="parch-btn" data-scene="oriental"><span class="txt-long">🌸 寶船與櫻花島</span><span class="txt-short">🌸 寶船</span></button>
          </div>
        </div>

        <div class="control-group">
          <div class="btn-group">
            <button class="parch-btn danger-accent" id="btnFireCannon"><span class="txt-long">🔥 開砲 Fire a cannon</span><span class="txt-short">🔥 開砲</span></button>
            <button class="parch-btn" id="btnCallDolphins"><span class="txt-long">🐬 召喚海豚 Call dolphins</span><span class="txt-short">🐬 海豚</span></button>
            <button class="parch-btn" id="btnRockBottle"><span class="txt-long">🍾 搖晃瓶身 Rock bottle</span><span class="txt-short">🍾 搖晃</span></button>
            <button class="parch-btn" id="btnTossBarrel"><span class="txt-long">🛢️ 投擲木桶 Toss barrel</span><span class="txt-short">🛢️ 木桶</span></button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Core Application Modules -->
  <script src="js/voxel-engine.js"></script>
  <script src="js/bottle-and-stand.js"></script>
  <script src="js/water-and-shaders.js"></script>
  <script src="js/scenes-builder.js"></script>
  <script src="js/atmosphere-and-fx.js"></script>
  <script src="js/controls-and-ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
