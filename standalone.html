    const ropePts = [
      new THREE.Vector3(0, 1.05, 0), new THREE.Vector3(-0.9, 0.25, 0.28),
      new THREE.Vector3(0, 1.05, 0), new THREE.Vector3(-0.9, 0.25, -0.28),
      new THREE.Vector3(0, 1.05, 0), new THREE.Vector3(0.5, 0.9, 0),
      new THREE.Vector3(0.5, 0.9, 0), new THREE.Vector3(1.35, 0.38, 0),
      new THREE.Vector3(-0.45, 0.85, 0), new THREE.Vector3(0, 1.05, 0)
    ];
    const ropePos = [];
    for (const p of ropePts) ropePos.push(p.x, p.y, p.z);
    const ropeGeom = new THREE.BufferGeometry();
    ropeGeom.setAttribute('position', new THREE.Float32BufferAttribute(ropePos, 3));
    const ropeLines = new THREE.LineSegments(ropeGeom, new THREE.LineBasicMaterial({ color: 0x24160c }));
    shipGroup.add(ropeLines);

    return shipGroup;
  }

  function buildMiniatureSceneWorld(theme = 'pirate') {
    const worldGroup = new THREE.Group();
    const cfg = SCENE_CONFIGS[theme] || SCENE_CONFIGS.pirate;

    const vb = new VoxelBuilder(0.085);

    const sandLight = theme === 'ghost' ? 0x2c353d : (theme === 'viking' ? 0x7b8ea0 : 0xc4a46c);
    const sandDark  = theme === 'ghost' ? 0x1e252b : (theme === 'viking' ? 0x56697a : 0xa6854e);
    const rockDark  = theme === 'ghost' ? 0x1f2429 : (theme === 'viking' ? 0x43505e : 0x4a453e);
    const rockMid   = theme === 'ghost' ? 0x2e353d : (theme === 'viking' ? 0x5e6f82 : 0x635d54);
    const rockLight = theme === 'ghost' ? 0x414954 : (theme === 'viking' ? 0x8295a8 : 0x7a7368);
    const grassDark = theme === 'ghost' ? 0x1c4036 : (theme === 'viking' ? 0xdbe9f5 : (theme === 'oriental' ? 0x346b3e : 0x3b692f));
    const grassLight= theme === 'ghost' ? 0x29594b : (theme === 'viking' ? 0xf2f8ff : (theme === 'oriental' ? 0x4b8a4d : 0x528540));

    // =========================================================================
    // 1. CONTIGUOUS SEABED & LUSH FOREGROUND/MIDGROUND CORAL REEF + KELP FOREST
    // =========================================================================
    for (let x = -60; x <= 52; x++) {
      for (let z = -18; z <= 18; z++) {
        const undulate = Math.round(Math.sin(x * 0.14) * Math.cos(z * 0.22) * 1.4);
        const yTop = -20 + undulate;
        for (let y = -23; y <= yTop; y++) {
          vb.set(x, y, z, y === yTop ? sandLight : sandDark);
        }
      }
    }

    const coralColors = theme === 'ghost'
      ? [0x3bf5c4, 0x9d4edd, 0x00bbf9, 0x7209b7]
      : (theme === 'viking'
        ? [0x90e0ef, 0xcaf0f8, 0x48cae4, 0x72efdd]
        : [0xd9387c, 0x7b35b8, 0x24bdd4, 0xe05d26, 0xebaa28]);

    // Dense coral reef & swaying kelp forest visible right through the front lower bottle curve (frame_04.png!)
    for (let i = 0; i < 68; i++) {
      const h1 = Math.sin(i * 19.31 + 1.7) * 43758.5453;
      const fx = h1 - Math.floor(h1);
      const h2 = Math.sin(i * 43.17 + 5.3) * 43758.5453;
      const fz = h2 - Math.floor(h2);

      const cx = Math.round(-46 + fx * 86);
      // Bias corals toward front half of bottle (z from -4 to +16) so they pop through the front glass!
      const cz = Math.round(-4 + fz * 19);
      const col = coralColors[i % coralColors.length];
      const baseY = -19;

      if (i % 3 === 0) {
        // Tall branching staghorn coral (up to 9 voxels tall!)
        const height = 5 + (i % 5);
        for (let h = 0; h < height; h++) {
          vb.set(cx, baseY + h, cz, col, { emissive: theme === 'ghost' });
          if (h >= 2) {
            vb.set(cx + (h % 2 === 0 ? 1 : -1), baseY + h, cz, col, { emissive: theme === 'ghost' });
            vb.set(cx, baseY + h, cz + (h % 2 === 1 ? 1 : -1), col, { emissive: theme === 'ghost' });
          }
        }
      } else if (i % 3 === 1) {
        // Tall swaying kelp forest fronds reaching nearly to the surface!
        const kelpCol = theme === 'ghost' ? 0x1b7a63 : 0x22753f;
        const kelpH = 8 + (i % 6);
        for (let h = 0; h < kelpH; h++) {
          const sway = Math.round(Math.sin(h * 0.55 + i) * 0.8);
          vb.set(cx + sway, baseY + h, cz, kelpCol);
          if (h % 3 === 1) vb.set(cx + sway + 1, baseY + h, cz, kelpCol);
        }
      } else {
        // Vibrant purple/pink tube & brain coral cluster
        vb.box(cx - 1, baseY, cz - 1, cx + 1, baseY + 3, cz + 1, col, { emissive: theme === 'ghost' });
        vb.set(cx, baseY + 4, cz, col, { emissive: theme === 'ghost' });
      }
    }

    // =========================================================================
    // 2. LEFT ISLAND (cx = -39, cz = -1 -> world x ≈ -3.32, z ≈ -0.09)
    // =========================================================================
    const leftCX = -39, leftCZ = -1;
    for (let y = -20; y <= 3; y++) {
      const rad = y < -4
        ? 13.5 - (y + 20) * 0.08
        : 12.5 - (y + 4) * 1.15;
      for (let dx = -15; dx <= 15; dx++) {
        for (let dz = -15; dz <= 15; dz++) {
          const lobe = Math.sin(Math.atan2(dz, dx) * 3.0 + 0.8) * 1.3;
          const d = Math.sqrt(dx * dx + dz * dz);
          if (d <= rad + lobe) {
            let col = y < -4 ? rockDark : (y < 0 ? rockMid : (d < rad - 1.2 ? grassLight : grassDark));
            if (y === -4 && d > rad - 1.5) col = sandLight;
            vb.set(leftCX + dx, y, leftCZ + dz, col);
          }
        }
      }
    }

    if (theme === 'pirate') {
      const lhx = leftCX - 3, lhz = leftCZ - 2;
      for (let h = 0; h <= 16; h++) {
        const y = 3 + h;
        const r = h < 13 ? (3.6 - h * 0.09) : (h === 13 ? 3.5 : (h <= 15 ? 2.5 : 1.6));
        const stripeRed = Math.floor(h / 3) % 2 === 0;
        let col = stripeRed ? 0xb8291d : 0xf2ede2;
        let isEmissive = false;
        if (h === 13) col = 0x1e2022;
        else if (h === 14 || h === 15) { col = 0xffe885; isEmissive = true; }
        else if (h === 16) col = 0xa32217;
        vb.disc(lhx, y, lhz, r, col, { emissive: isEmissive, jitter: isEmissive ? 0 : 0.02 });
      }
      const ctx = leftCX + 4, ctz = leftCZ + 2;
      vb.box(ctx - 3, 3, ctz - 2, ctx + 3, 6, ctz + 2, 0xe8e0d0);
      vb.set(ctx - 1, 4, ctz + 2, 0xffcf52, { emissive: true, jitter: 0 });
      vb.set(ctx + 1, 4, ctz + 2, 0xffcf52, { emissive: true, jitter: 0 });
      vb.set(ctx + 3, 4, ctz,     0xffcf52, { emissive: true, jitter: 0 });
      for (let ry = 0; ry <= 2; ry++) {
        vb.box(ctx - 4 + ry, 7 + ry, ctz - 3 + ry, ctx + 4 - ry, 7 + ry, ctz + 3 - ry, 0xa82a1d);
      }
      vb.box(ctx + 2, 7, ctz - 2, ctx + 3, 11, ctz - 1, rockMid);
      vb.box(leftCX + 10, -3, leftCZ + 1, leftCX + 17, -3, leftCZ + 3, 0x5e3b1e);
      vb.set(leftCX + 12, -4, leftCZ + 1, 0x362010);
      vb.set(leftCX + 16, -4, leftCZ + 1, 0x362010);
      vb.set(leftCX + 16, -2, leftCZ + 1, 0x4a2c16);
    } else if (theme === 'ghost') {
      const lhx = leftCX - 2, lhz = leftCZ - 1;
      for (let h = 0; h <= 15; h++) {
        const r = h < 12 ? 3.8 - h * 0.08 : 4.2;
        const isFire = h >= 13;
        vb.disc(lhx, 3 + h, lhz, isFire ? 2.6 : r, isFire ? 0x3df5b8 : 0x242a32, { emissive: isFire });
      }
      vb.box(leftCX + 3, 1, leftCZ + 7, leftCX + 4, 2, leftCZ + 8, 0x3df5b8, { emissive: true });
      vb.box(leftCX + 7, 1, leftCZ + 6, leftCX + 8, 2, leftCZ + 7, 0x3df5b8, { emissive: true });
    } else if (theme === 'viking') {
      const lhx = leftCX - 3, lhz = leftCZ - 1;
      for (let h = 0; h <= 14; h++) {
        vb.box(lhx - 2, 3 + h, lhz - 2, lhx + 2, 3 + h, lhz + 2, h % 3 === 0 ? 0x382111 : 0x5c371d);
      }
      vb.sphere(lhx, 19, lhz, 2.8, 2.5, 2.8, 0xff8c24, { emissive: true });
      vb.box(leftCX + 2, 3, leftCZ - 2, leftCX + 8, 6, leftCZ + 3, 0x4f2f18);
      vb.set(leftCX + 5, 4, leftCZ + 3, 0xffb84d, { emissive: true });
      for (let ry = 0; ry <= 3; ry++) {
        vb.box(leftCX + 1 + ry, 7 + ry, leftCZ - 3 + ry, leftCX + 9 - ry, 7 + ry, leftCZ + 4 - ry, 0xeef6fc);
      }
    } else if (theme === 'oriental') {
      const px = leftCX - 2, pz = leftCZ - 1;
      for (let tier = 0; tier < 3; tier++) {
        const baseY = 3 + tier * 5;
        const w = 4 - tier;
        vb.box(px - w, baseY, pz - w, px + w, baseY + 3, pz + w, 0xf0e9dc);
        vb.set(px, baseY + 1, pz + w, 0xffcf66, { emissive: true });
        vb.set(px + w, baseY + 1, pz, 0xffcf66, { emissive: true });
        vb.box(px - w - 2, baseY + 3, pz - w - 2, px + w + 2, baseY + 4, pz + w + 2, 0xa82219);
      }
      for (let s = 18; s <= 22; s++) vb.set(px, s, pz, 0xe0b034);
      const tx = leftCX + 13;
      vb.box(tx, -6, leftCZ - 3, tx, 2, leftCZ - 3, 0xc9251b);
      vb.box(tx, -6, leftCZ + 3, tx, 2, leftCZ + 3, 0xc9251b);
      vb.box(tx, 1, leftCZ - 4, tx, 1, leftCZ + 4, 0xc9251b);
      vb.box(tx, 3, leftCZ - 5, tx, 3, leftCZ + 5, 0x1e1816);
      vb.set(tx, 2, leftCZ, 0xe0b034, { emissive: true });
    }

    // =========================================================================
    // 3. CENTER-BACK ISLAND (cx = 2, cz = -6 -> world x ≈ +0.17, z ≈ -0.51)
    //    Tall Stepped Twin Craggy Mountain Peaks with Cascading Central Waterfall (frame_01 & frame_04!)
    // =========================================================================
    const midCX = 2, midCZ = -6;
    for (let y = -20; y <= 16; y++) {
      // Correct height above water: hAboveWater = 0 at y = -4, up to 20 at y = 16!
      const hAbove = Math.max(0, y + 4);
      const stepH = Math.floor(hAbove / 2) * 2;
      const maxRadL = y < -4 ? 14.5 : Math.max(0, 13.8 - stepH * 0.52);
      const maxRadR = y < -4 ? 13.8 : Math.max(0, 12.8 - stepH * 0.48);

      for (let dx = -20; dx <= 20; dx++) {
        for (let dz = -12; dz <= 10; dz++) {
          const dPeakL = Math.sqrt(Math.pow((dx + 6.5) * 0.85, 2) + Math.pow(dz * 1.15, 2));
          const dPeakR = Math.sqrt(Math.pow((dx - 6.5) * 0.85, 2) + Math.pow(dz * 1.15, 2));

          if (dPeakL <= maxRadL || dPeakR <= maxRadR) {
            // Central canyon gorge between the two peaks with cascading waterfall / lava river
            const inGorge = (Math.abs(dx) <= 2 && dz >= -2 && y >= -4 && y <= 13);
            if (inGorge) {
              const wfZ = Math.round(5.8 - hAbove * 0.34);
              if (dz >= wfZ - 1 && dz <= wfZ + 1) {
                const isLava = theme === 'ghost';
                const wfCol = isLava
                  ? ((y + dx) % 2 === 0 ? 0xff4d00 : 0xffaa11)
                  : ((y + dx) % 2 === 0 ? 0x4dd8f5 : 0xe0fbff);
                vb.set(midCX + dx, y, midCZ + dz, wfCol, { emissive: isLava, jitter: 0.02 });
              }
              continue;
            }

            let col = rockMid;
            if (y < -4) {
              col = rockDark;
            } else if (y >= 12 || (y >= 8 && (dPeakL <= maxRadL - 1.2 || dPeakR <= maxRadR - 1.2) && dz < 2)) {
              col = (y % 2 === 0) ? grassLight : grassDark;
            } else if (hAbove % 4 === 0) {
              col = rockLight;
            } else if (hAbove % 4 === 2) {
              col = rockDark;
            }
            vb.set(midCX + dx, y, midCZ + dz, col);
          }
        }
      }
    }
    // White plunge-pool foam at waterfall base (y = -3)
    for (let dx = -3; dx <= 3; dx++) {
      for (let dz = 4; dz <= 8; dz++) {
        vb.set(midCX + dx, -3, midCZ + dz, theme === 'ghost' ? 0xff6611 : 0xe8fbff, { emissive: theme === 'ghost' });
      }
    }

    // =========================================================================
    // 4. RIGHT ISLAND (cx = 30, cz = 1 -> world x ≈ +2.55, z ≈ +0.09)
    // =========================================================================
    const rightCX = 30, rightCZ = 1;
    for (let y = -20; y <= 1; y++) {
      const rad = y < -4 ? 12.2 : (11.5 - (y + 4) * 1.45);
      for (let dx = -13; dx <= 13; dx++) {
        for (let dz = -13; dz <= 13; dz++) {
          const d = Math.sqrt(dx * dx + dz * dz);
          if (d <= rad + Math.sin(dx * 0.4 + dz * 0.5) * 0.9) {
            let col = y < -4 ? rockDark : (y <= -1 ? sandLight : grassLight);
            vb.set(rightCX + dx, y, rightCZ + dz, col);
          }
        }
      }
    }

    const treeTrunkCol = theme === 'ghost' ? 0x241b22 : 0x5c381c;
    const leafCols = theme === 'oriental'
      ? [0xf58cb0, 0xffadc8, 0xd9688c]
      : (theme === 'viking'
        ? [0x1d4732, 0x2a5e43, 0xe8f4ff]
        : (theme === 'ghost'
          ? [0x1c4f45, 0x153832, 0x35e0b0]
          : [0x225c27, 0x337834, 0x489642]));

    for (let h = 1; h <= 9; h++) {
      const bendX = Math.round(Math.sin(h * 0.25) * 1.5);
      vb.box(rightCX + bendX, h, rightCZ - 2, rightCX + bendX + 1, h, rightCZ - 1, treeTrunkCol);
    }
    const canopyCenters = [
      { x: rightCX + 1, y: 10, z: rightCZ - 1, rx: 6.5, ry: 2.4, rz: 6.2 },
      { x: rightCX - 3, y: 8,  z: rightCZ + 1, rx: 4.6, ry: 2.0, rz: 4.5 },
      { x: rightCX + 4, y: 8,  z: rightCZ - 2, rx: 4.8, ry: 2.0, rz: 4.5 }
    ];
    for (let cIdx = 0; cIdx < canopyCenters.length; cIdx++) {
      const c = canopyCenters[cIdx];
      vb.sphere(c.x, c.y, c.z, c.rx, c.ry, c.rz, leafCols[cIdx % leafCols.length], { jitter: 0.04 });
    }

    const fireX = rightCX - 3, fireZ = rightCZ + 3;
    vb.box(fireX - 1, 1, fireZ - 1, fireX + 1, 1, fireZ + 1, 0x331d0e);
    const fireCoreCol = theme === 'ghost' ? 0x4effc8 : 0xff9911;
    const fireTipCol  = theme === 'ghost' ? 0xb666ff : 0xffee55;
    vb.box(fireX - 1, 2, fireZ - 1, fireX + 1, 3, fireZ + 1, fireCoreCol, { emissive: true, jitter: 0 });
    vb.set(fireX, 4, fireZ, fireTipCol, { emissive: true, jitter: 0 });

    vb.box(rightCX + 3, 1, rightCZ + 2, rightCX + 5, 2, rightCZ + 3, 0x4f2b13);
    vb.box(rightCX + 3, 2, rightCZ + 2, rightCX + 5, 2, rightCZ + 3, 0xffd000, { emissive: true });
    vb.set(rightCX - 6, 0, rightCZ + 5, 0xc92c1d);

    vb.clipToBottleInterior(0, 0, 0, 2.03);

    const staticWorldMesh = vb.buildMesh({ roughness: 0.74, metalness: 0.05 });
    worldGroup.add(staticWorldMesh);

    // =========================================================================
    // 5. DYNAMIC BUOYANT SHIP, MOORED ROWBOAT & SOFT VOLUMETRIC LIGHTHOUSE BEAM
    // =========================================================================
    const shipGroup = buildShipGroup(theme);
    shipGroup.position.set(-0.78, WATER_LEVEL_Y, 0.46);
    worldGroup.add(shipGroup);

    const rowboatVb = new VoxelBuilder(0.055);
    rowboatVb.box(-3, 0, -1, 3, 1, 1, 0x5e361a);
    rowboatVb.box(-2, 1,  0, 2, 1, 0, 0x3d2210);
    const rowboatMesh = rowboatVb.buildMesh({ roughness: 0.72, metalness: 0.04 });
    const rowboatGroup = new THREE.Group();
    rowboatGroup.add(rowboatMesh);
    rowboatGroup.position.set(-1.95, WATER_LEVEL_Y, 0.25);
    worldGroup.add(rowboatGroup);

    // Soft-Fading Volumetric Lighthouse Beacon Beam (using custom ShaderMaterial with smooth radial & axial falloff!)
    const lighthouseBeamGroup = new THREE.Group();
    lighthouseBeamGroup.position.set(-3.57, 1.48, -0.26);
    const beamConeGeom = new THREE.CylinderGeometry(0.06, 0.68, 3.0, 24, 1, true);
    const bPos = beamConeGeom.attributes.position.array;
    for (let i = 0; i < bPos.length; i += 3) {
      const x = bPos[i], y = bPos[i + 1], z = bPos[i + 2];
      bPos[i] = 1.5 - y;
      bPos[i + 1] = x * 0.52;
      bPos[i + 2] = z;
    }
    const beamMat = new THREE.ShaderMaterial({
      uniforms: {
        uBeamColor: { value: new THREE.Color(cfg.lanternColors[0]) },
        uBeamOpacity: { value: 0.25 }
      },
      transparent: true,
      depthWrite: false,
      side: THREE.DoubleSide,
      blending: THREE.AdditiveBlending,
      vertexShader: `
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vWorldPos;
        void main() {
          vUv = uv;
          vec4 wp = modelMatrix * vec4(position, 1.0);
          vWorldPos = wp.xyz;
          vNormal = normalize(mat3(modelMatrix) * normal);
          gl_Position = projectionMatrix * viewMatrix * wp;
        }
      `,
      fragmentShader: `
        uniform vec3 uBeamColor;
        uniform float uBeamOpacity;
        varying vec2 vUv;
        varying vec3 vNormal;
        varying vec3 vWorldPos;
        void main() {
          vec3 V = normalize(cameraPosition - vWorldPos);
          float edgeSoftness = pow(abs(dot(normalize(vNormal), V)), 1.4);
          // vUv.y = 1 at apex near lantern, 0 at far end of beam
          float axialFade = pow(clamp(vUv.y, 0.0, 1.0), 1.65) * smoothstep(0.0, 0.15, vUv.y);
          float alpha = edgeSoftness * axialFade * uBeamOpacity;
          gl_FragColor = vec4(uBeamColor, alpha);
        }
      `
    });
    const beamMesh1 = new THREE.Mesh(beamConeGeom, beamMat);
    const beamMesh2 = new THREE.Mesh(beamConeGeom, beamMat);
    beamMesh2.rotation.y = Math.PI;
    lighthouseBeamGroup.add(beamMesh1, beamMesh2);
    beamMesh1.renderOrder = 22;
    beamMesh2.renderOrder = 22;
    worldGroup.add(lighthouseBeamGroup);

    // Animated Waterfall Mist & Campfire Embers Particle System
    const mistCount = 52;
    const mistPos = new Float32Array(mistCount * 3);
    const mistCol = new Float32Array(mistCount * 3);
    const mistMeta = [];
    const cWater = new THREE.Color(theme === 'ghost' ? 0xff7722 : 0xd4fbff);
    const cFire  = new THREE.Color(cfg.lanternColors[2]);

    for (let i = 0; i < mistCount; i++) {
      const isFire = i >= 36;
      mistMeta.push({
        isFire,
        phase: Math.random() * Math.PI * 2,
        speed: 0.65 + Math.random() * 0.85,
        offsetX: (Math.random() - 0.5) * 0.26,
        offsetZ: (Math.random() - 0.5) * 0.20
      });
      const col = isFire ? cFire : cWater;
      mistCol[i * 3] = col.r;
      mistCol[i * 3 + 1] = col.g;
      mistCol[i * 3 + 2] = col.b;
    }
    const mistGeom = new THREE.BufferGeometry();
    mistGeom.setAttribute('position', new THREE.Float32BufferAttribute(mistPos, 3));
    mistGeom.setAttribute('color', new THREE.Float32BufferAttribute(mistCol, 3));
    const mistPoints = new THREE.Points(mistGeom, new THREE.PointsMaterial({
      size: 2.0,
      vertexColors: true,
      transparent: true,
      opacity: 0.88,
      depthWrite: false
    }));
    mistPoints.renderOrder = 18;
    worldGroup.add(mistPoints);

    let auroraMesh = null;
    if (theme === 'viking') {
      const aGeom = new THREE.PlaneGeometry(8.2, 0.95, 48, 4);
      const aMat = new THREE.ShaderMaterial({
        uniforms: { uTime: { value: 0 } },
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide,
        blending: THREE.AdditiveBlending,
        vertexShader: `
          uniform float uTime;
          varying vec2 vUv;
          void main() {
            vUv = uv;
            vec3 p = position;
            p.z += sin(p.x * 1.4 + uTime * 1.2) * 0.35;
            p.y += cos(p.x * 2.1 - uTime * 0.9) * 0.12;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
          }
        `,
        fragmentShader: `
          uniform float uTime;
          varying vec2 vUv;
          void main() {
            float curtain = sin(vUv.x * 18.0 + uTime * 1.5) * 0.5 + 0.5;
            float fadeY = sin(vUv.y * 3.14159);
            float fadeX = smoothstep(0.0, 0.15, vUv.x) * smoothstep(1.0, 0.85, vUv.x);
            vec3 col = mix(vec3(0.15, 0.95, 0.62), vec3(0.45, 0.55, 1.0), vUv.y);
            float alpha = fadeY * fadeX * (0.22 + 0.28 * curtain);
            gl_FragColor = vec4(col, alpha);
          }
        `
      });
      auroraMesh = new THREE.Mesh(aGeom, aMat);
      auroraMesh.position.set(-0.4, 1.32, -0.35);
      auroraMesh.renderOrder = 20;
      worldGroup.add(auroraMesh);
    }

    worldGroup.userData = {
      config: cfg,
      shipGroup,
      rowboatGroup,
      lighthouseBeamGroup,
      beamMat,
      auroraMesh,
      updateSceneDetails: (time, waveIntensity, bottleRock, nightFactor) => {
        const shipPose = sampleOceanPose(shipGroup.position.x, shipGroup.position.z, time, waveIntensity, bottleRock);
        shipGroup.position.y = shipPose.y + 0.04;
        shipGroup.rotation.z = shipPose.pitchZ + Math.sin(time * 1.9) * 0.025 * (0.5 + waveIntensity);
        shipGroup.rotation.x = shipPose.rollX  + Math.cos(time * 1.4) * 0.04 * (0.5 + waveIntensity);

        const boatPose = sampleOceanPose(rowboatGroup.position.x, rowboatGroup.position.z, time + 1.1, waveIntensity, bottleRock);
        rowboatGroup.position.y = boatPose.y + 0.01;
        rowboatGroup.rotation.z = boatPose.pitchZ * 1.25;
        rowboatGroup.rotation.x = boatPose.rollX * 1.25;

        lighthouseBeamGroup.rotation.y = time * 1.15;
        beamMat.uniforms.uBeamOpacity.value = 0.04 + nightFactor * 0.42;

        const posArr = mistGeom.attributes.position.array;
        for (let i = 0; i < mistCount; i++) {
          const m = mistMeta[i];
          const t = (time * m.speed + m.phase) % 1.0;
          if (!m.isFire) {
            posArr[i * 3]     = 0.17 + m.offsetX;
            posArr[i * 3 + 1] = 0.78 - t * 1.12;
            posArr[i * 3 + 2] = -0.35 + t * 0.42 + m.offsetZ * 0.25;
          } else {
            posArr[i * 3]     = 2.30 + m.offsetX * 0.7 + Math.sin(time * 3.0 + i) * 0.05;
            posArr[i * 3 + 1] = -0.15 + t * 0.85;
            posArr[i * 3 + 2] = 0.34 + m.offsetZ * 0.7;
          }
        }
        mistGeom.attributes.position.needsUpdate = true;

        if (auroraMesh) {
          auroraMesh.material.uniforms.uTime.value = time;
        }
      }
    };

    return worldGroup;
  }

  window.SCENE_CONFIGS = SCENE_CONFIGS;
  window.buildMiniatureSceneWorld = buildMiniatureSceneWorld;
})();


/**
 * atmosphere-and-fx.js
 * Implements:
 * 1. Drifting 3D Voxel Clouds inside the upper bottle cylinder
 * 2. Flapping 3D Voxel Seagulls soaring in figure-eight loops
 * 3. Glowing Sun/Moon Celestial Orb + Twinkling Night Stars & Golden Fireflies (seen in frame_01 & frame_13)
 * 4. Weather System: Sunny (晴天), Rainy (雨天), Stormy Squall (暴風雨) with slanted rain streaks & 3D lightning bolts
 * 5. Interactive FX: Floating Barrels, Cannonball Fire + Muzzle Flash + Smoke, Leaping Voxel Dolphins, Pebble Drops
 * 6. Procedural Web Audio API Soundscape (Ocean waves, rain, thunder, cannon blast, splash)
 */
(function () {
  function createVoxelCloudMesh(scale = 1.0, seed = 0) {
    const vb = new VoxelBuilder(0.075 * scale);
    const puffs = [
      { x: 0,  y: 0, z: 0, rx: 4.2, ry: 1.8, rz: 2.6 },
      { x: -3, y: -0.4, z: 0.4, rx: 3.1, ry: 1.4, rz: 2.1 },
      { x: 3,  y: -0.3, z: -0.3, rx: 3.3, ry: 1.5, rz: 2.2 },
      { x: 1,  y: 1.0, z: 0, rx: 2.6, ry: 1.4, rz: 1.8 }
    ];
    for (const p of puffs) {
      vb.sphere(p.x, p.y, p.z, p.rx, p.ry, p.rz, 0xf6f8fb, { jitter: 0.02 });
    }
    return vb.buildMesh({ roughness: 0.85, metalness: 0.02 });
  }

  function createVoxelSeagullGroup() {
    const gull = new THREE.Group();
    const bodyVb = new VoxelBuilder(0.042);
    bodyVb.box(0, 0, -2, 0, 0, 2, 0xf7f7f7);
    bodyVb.set(0, 0, 3, 0xf5b82e); // yellow beak
    bodyVb.set(0, 0, -3, 0x444952); // tail tip
    gull.add(bodyVb.buildMesh({ roughness: 0.7 }));

    const wingVbL = new VoxelBuilder(0.042);
    wingVbL.box(-4, 0, -1, -1, 0, 1, 0xf2f4f7);
    wingVbL.box(-5, 0, -1, -4, 0, 0, 0x3b4048); // dark wingtip
    const wingL = wingVbL.buildMesh({ roughness: 0.7 });

    const wingVbR = new VoxelBuilder(0.042);
    wingVbR.box(1, 0, -1, 4, 0, 1, 0xf2f4f7);
    wingVbR.box(4, 0, -1, 5, 0, 0, 0x3b4048);
    const wingR = wingVbR.buildMesh({ roughness: 0.7 });

    gull.add(wingL, wingR);
    gull.userData = { wingL, wingR };
    return gull;
  }

  function createVoxelBarrelMesh(variant = 0) {
    const vb = new VoxelBuilder(0.048);
    const wood = variant % 2 === 0 ? 0x7c4d28 : 0x633b1d;
    const hoop = 0x2c2f33;
    for (let x = -2; x <= 2; x++) {
      for (let y = -1; y <= 1; y++) {
        for (let z = -1; z <= 1; z++) {
          const isHoop = (Math.abs(x) === 1);
          vb.set(x, y, z, isHoop ? hoop : wood);
        }
      }
    }
    return vb.buildMesh({ roughness: 0.72, metalness: 0.12 });
  }

  function createVoxelDolphinMesh() {
    const vb = new VoxelBuilder(0.048);
    const topBlue = 0x3d85ad;
    const belly   = 0xdbeeff;
    // Sleek arched dolphin body along X
    for (let x = -5; x <= 5; x++) {
      const archY = Math.round(Math.cos(x * 0.28) * 1.4);
      const r = Math.abs(x) <= 2 ? 1 : 0;
      for (let z = -r; z <= r; z++) {
        vb.set(x, archY, z, topBlue);
        if (Math.abs(x) <= 3) vb.set(x, archY - 1, z, belly);
      }
    }
    // Dorsal fin
    vb.set(0, 2, 0, topBlue);
    vb.set(-1, 3, 0, topBlue);
    // Tail flukes
    vb.set(-6, 0, -1, topBlue);
    vb.set(-6, 0,  0, topBlue);
    vb.set(-6, 0,  1, topBlue);
    // Rostrum (snout)
    vb.set(6, 0, 0, topBlue);
    return vb.buildMesh({ roughness: 0.35, metalness: 0.1 });
  }

  function createAtmosphereAndFXSystem(bottleInteriorGroup, oceanSystem) {
    const fxGroup = new THREE.Group();
    bottleInteriorGroup.add(fxGroup);

    // 1. Drifting 3D Voxel Clouds (5 clouds inside upper bottle)
    const clouds = [];
    const cloudConfigs = [
      { x: -3.1, y: 1.32, z: -0.25, scale: 0.95, speed: 0.14 },
      { x: -1.1, y: 1.42, z:  0.18, scale: 1.08, speed: 0.11 },
      { x:  0.9, y: 1.36, z: -0.32, scale: 0.88, speed: 0.16 },
      { x:  2.4, y: 1.28, z:  0.15, scale: 0.78, speed: 0.13 },
      { x: -0.2, y: 1.24, z:  0.42, scale: 0.72, speed: 0.18 }
    ];
    for (let i = 0; i < cloudConfigs.length; i++) {
      const cc = cloudConfigs[i];
      const mesh = createVoxelCloudMesh(cc.scale, i);
      mesh.position.set(cc.x, cc.y, cc.z);
      fxGroup.add(mesh);
      clouds.push({ mesh, baseZ: cc.z, baseY: cc.y, speed: cc.speed, phase: i * 1.7 });
    }

    // 2. Flapping Voxel Seagulls (3 birds circling inside bottle)
    const seagulls = [];
    for (let i = 0; i < 3; i++) {
      const g = createVoxelSeagullGroup();
      fxGroup.add(g);
      seagulls.push({
        group: g,
        centerX: -1.6 + i * 1.45,
        centerY: 0.92 + (i % 2) * 0.22,
        centerZ: (i - 1) * 0.25,
        radiusX: 0.85 + i * 0.15,
        radiusZ: 0.42,
        speed: 0.95 + i * 0.18,
        phase: i * 2.1
      });
    }

    // 3. Celestial Orb (Sun / Moon) inside the upper bottle sky (seen in frame_01.png!)
    const celestialGroup = new THREE.Group();
    const orbCore = new THREE.Mesh(
      new THREE.SphereGeometry(0.22, 20, 16),
      new THREE.MeshBasicMaterial({ color: 0xfff5cc })
    );
    const orbHalo = new THREE.Mesh(
      new THREE.SphereGeometry(0.42, 20, 16),
      new THREE.MeshBasicMaterial({
        color: 0xffe499,
        transparent: true,
        opacity: 0.36,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      })
    );
    orbHalo.renderOrder = 21;
    celestialGroup.add(orbCore, orbHalo);
    fxGroup.add(celestialGroup);

    // 4. Twinkling Night Stars & Golden Fireflies inside the bottle (seen in frame_13.png!)
    const starCount = 78;
    const starPos = new Float32Array(starCount * 3);
    const starCol = new Float32Array(starCount * 3);
    const starBase = [];
    for (let i = 0; i < starCount; i++) {
      const sx = -4.6 + Math.random() * 8.2;
      const sy = -0.15 + Math.random() * 1.75;
      const maxZ = Math.sqrt(Math.max(0.05, 1.85 * 1.85 - sy * sy));
      const sz = (Math.random() * 2 - 1) * maxZ * 0.85;
      starPos[i * 3] = sx;
      starPos[i * 3 + 1] = sy;
      starPos[i * 3 + 2] = sz;
      const isWarmFirefly = (i % 3 === 0 || sy < 0.45);
      const c = isWarmFirefly ? new THREE.Color(0xffe07d) : new THREE.Color(0xdbeeff);
      starCol[i * 3] = c.r;
      starCol[i * 3 + 1] = c.g;
      starCol[i * 3 + 2] = c.b;
      starBase.push({ x: sx, y: sy, z: sz, isWarmFirefly, phase: Math.random() * Math.PI * 2 });
    }
    const starGeom = new THREE.BufferGeometry();
    starGeom.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
    starGeom.setAttribute('color', new THREE.Float32BufferAttribute(starCol, 3));
    const starMat = new THREE.PointsMaterial({
      size: 2.8,
      vertexColors: true,
      transparent: true,
      opacity: 0.0,
      depthWrite: false,
      blending: THREE.AdditiveBlending
    });
    const starPoints = new THREE.Points(starGeom, starMat);
    starPoints.renderOrder = 21;
    fxGroup.add(starPoints);

    // 5. Weather Rain Streaks & 3D Jagged Lightning Bolt inside the bottle
    const rainCount = 220;
    const rainLinePos = new Float32Array(rainCount * 6); // 2 vertices per rain streak
    const rainDrops = [];
    for (let i = 0; i < rainCount; i++) {
      rainDrops.push({
        x: -4.8 + Math.random() * 8.8,
        y: -0.3 + Math.random() * 1.85,
        z: (Math.random() * 2 - 1) * 1.35,
        speed: 3.2 + Math.random() * 1.6
      });
    }
    const rainGeom = new THREE.BufferGeometry();
    rainGeom.setAttribute('position', new THREE.Float32BufferAttribute(rainLinePos, 3));
    const rainMat = new THREE.LineBasicMaterial({
      color: 0xaecde8,
      transparent: true,
      opacity: 0.0,
      depthWrite: false
    });
    const rainLines = new THREE.LineSegments(rainGeom, rainMat);
    rainLines.renderOrder = 22;
    rainLines.visible = false;
    fxGroup.add(rainLines);

    // 3D Lightning Bolt Line
    const boltPos = new Float32Array(16 * 3);
    const boltGeom = new THREE.BufferGeometry();
    boltGeom.setAttribute('position', new THREE.Float32BufferAttribute(boltPos, 3));
    const boltMat = new THREE.LineBasicMaterial({ color: 0xeef8ff, transparent: true, opacity: 0 });
    const boltMesh = new THREE.LineSegments(boltGeom, boltMat);
    boltMesh.visible = false;
    boltMesh.renderOrder = 24;
    fxGroup.add(boltMesh);
    let lightningTimer = 0;
    let lightningFlashIntensity = 0;

    // 6. Floating Barrels & Crates on the Ocean Surface
    const barrels = [];
    const initialBarrelCoords = [
      { x: -1.65, z: 0.82 },
      { x:  0.55, z: 0.72 },
      { x:  1.35, z: 0.48 },
      { x:  1.15, z: 0.95 }
    ];
    for (let i = 0; i < initialBarrelCoords.length; i++) {
      const bMesh = createVoxelBarrelMesh(i);
      fxGroup.add(bMesh);
      barrels.push({
        mesh: bMesh,
        x: initialBarrelCoords[i].x,
        z: initialBarrelCoords[i].z,
        vy: 0,
        dropping: false,
        phase: i * 1.5
      });
    }

    // 7. Active Projectiles (Cannonballs, Tossed Barrels, Dropped Pebbles, Leaping Dolphins, Smoke Puffs)
    const activeProjectiles = [];
    const activeDolphins = [];
    const smokePuffs = [];

    function spawnSplashParticles(x, z, count = 10, colorHex = 0xe8f9ff) {
      for (let i = 0; i < count; i++) {
        const pMesh = new THREE.Mesh(
          new THREE.BoxGeometry(0.055, 0.055, 0.055),
          new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.9 })
        );
        pMesh.position.set(x, WATER_LEVEL_Y + 0.04, z);
        fxGroup.add(pMesh);
        const angle = Math.random() * Math.PI * 2;
        const spd = 0.4 + Math.random() * 0.9;
        smokePuffs.push({
          mesh: pMesh,
          vx: Math.cos(angle) * spd,
          vy: 1.1 + Math.random() * 1.2,
          vz: Math.sin(angle) * spd,
          gravity: -4.8,
          age: 0,
          maxAge: 0.65
        });
      }
    }

    function fireCannon(shipGroup) {
      if (!shipGroup) return;
      const sx = shipGroup.position.x;
      const sy = shipGroup.position.y + 0.16;
      const sz = shipGroup.position.z;

      // Fire 2 cannonballs from starboard/port forward broadsides
      const dirs = [
        { vx: -0.65, vz: 1.55 },
        { vx:  0.85, vz: 1.45 }
      ];
      for (const d of dirs) {
        const ball = new THREE.Mesh(
          new THREE.SphereGeometry(0.055, 10, 10),
          new THREE.MeshStandardMaterial({ color: 0x1e2024, emissive: 0xff6611, emissiveIntensity: 0.8 })
        );
        ball.position.set(sx + d.vx * 0.25, sy, sz + 0.22);
        fxGroup.add(ball);
        activeProjectiles.push({
          type: 'cannonball',
          mesh: ball,
          vx: d.vx,
          vy: 1.45,
          vz: d.vz,
          gravity: -3.8
        });

        // Muzzle flash & smoke cloud puffs
        for (let s = 0; s < 7; s++) {
          const isFlash = s < 2;
          const puff = new THREE.Mesh(
            new THREE.BoxGeometry(isFlash ? 0.09 : 0.075, isFlash ? 0.09 : 0.075, isFlash ? 0.09 : 0.075),
            new THREE.MeshBasicMaterial({
              color: isFlash ? 0xffaa22 : 0xd8dde6,
              transparent: true,
              opacity: 0.9
            })
          );
          puff.position.set(sx + d.vx * 0.22, sy, sz + 0.24);
          fxGroup.add(puff);
          smokePuffs.push({
            mesh: puff,
            vx: d.vx * (0.3 + Math.random() * 0.4) + (Math.random() - 0.5) * 0.3,
            vy: 0.25 + Math.random() * 0.45,
            vz: d.vz * (0.3 + Math.random() * 0.4),
            gravity: 0.3,
            age: 0,
            maxAge: isFlash ? 0.22 : 0.95
          });
        }
      }
      SoundFX.playCannon();
    }

    function callDolphins() {
      const starts = [
        { x: -2.1, z: 0.95, vx: 1.35, vz: -0.15, delay: 0.0 },
        { x: -1.4, z: 1.12, vx: 1.45, vz: -0.22, delay: 0.22 },
        { x:  0.2, z: 0.88, vx: 1.25, vz:  0.12, delay: 0.42 }
      ];
      for (const st of starts) {
        const dMesh = createVoxelDolphinMesh();
        dMesh.position.set(st.x, WATER_LEVEL_Y - 0.25, st.z);
        dMesh.visible = false;
        fxGroup.add(dMesh);
        activeDolphins.push({
          mesh: dMesh,
          x: st.x,
          z: st.z,
          vx: st.vx,
          vz: st.vz,
          age: -st.delay,
          duration: 1.35,
          splashedIn: false,
          splashedOut: false
        });
      }
      SoundFX.playDolphin();
    }

    function tossBarrel() {
      // Remove oldest dynamic barrel if > 9 barrels
      if (barrels.length >= 9) {
        const old = barrels.shift();
        fxGroup.remove(old.mesh);
      }
      const tx = -2.2 + Math.random() * 3.6;
      const tz = 0.25 + Math.random() * 0.85;
      const bMesh = createVoxelBarrelMesh(barrels.length);
      bMesh.position.set(tx, 0.95, tz);
      fxGroup.add(bMesh);
      barrels.push({
        mesh: bMesh,
        x: tx,
        z: tz,
        y: 0.95,
        vy: -0.2,
        dropping: true,
        phase: Math.random() * 6.28
      });
      SoundFX.playSplash();
    }

    function dropPebbleAt(x, z) {
      const clampedX = Math.max(-4.5, Math.min(3.8, x));
      const clampedZ = Math.max(-1.2, Math.min(1.2, z));
      const pebble = new THREE.Mesh(
        new THREE.BoxGeometry(0.065, 0.055, 0.065),
        new THREE.MeshStandardMaterial({ color: 0x99a2ad, roughness: 0.6 })
      );
      pebble.position.set(clampedX, 1.05, clampedZ);
      fxGroup.add(pebble);
      activeProjectiles.push({
        type: 'pebble',
        mesh: pebble,
        vx: 0,
        vy: -0.5,
        vz: 0,
        gravity: -4.6
      });
    }

    function triggerLightningBolt() {
      const startX = -2.5 + Math.random() * 4.5;
      const startZ = -0.3 + Math.random() * 0.6;
      const arr = boltGeom.attributes.position.array;
      let cx = startX, cy = 1.42, cz = startZ;
      for (let i = 0; i < 8; i++) {
        const nx = cx + (Math.random() - 0.5) * 0.38;
        const ny = cy - 0.22;
        const nz = cz + (Math.random() - 0.5) * 0.25;
        arr[i * 6]     = cx; arr[i * 6 + 1] = cy; arr[i * 6 + 2] = cz;
        arr[i * 6 + 3] = nx; arr[i * 6 + 4] = ny; arr[i * 6 + 5] = nz;
        cx = nx; cy = ny; cz = nz;
      }
      boltGeom.attributes.position.needsUpdate = true;
      boltMesh.visible = true;
      boltMat.opacity = 1.0;
      lightningFlashIntensity = 1.8;
      SoundFX.playThunder();
    }

    function update(dt, time, state) {
      const { hour, weather, waveIntensity, bottleRock, nightFactor } = state;

      // 1. Update drifting voxel clouds & weather tint
      const isRain = weather === 'rainy' || weather === 'stormy';
      const isStorm = weather === 'stormy';
      const sunsetFactor = Math.max(0, 1.0 - Math.min(Math.abs(hour - 6.5), Math.abs(hour - 18.2)) / 1.8);

      const cloudTint = new THREE.Color(0xffffff);
      if (isStorm) {
        cloudTint.setHex(0x4b5666);
      } else if (isRain) {
        cloudTint.setHex(0x8899ad);
      } else if (sunsetFactor > 0.05) {
        cloudTint.lerp(new THREE.Color(0xffbfa0), sunsetFactor * 0.65);
      }
      if (nightFactor > 0.05) {
        cloudTint.lerp(new THREE.Color(0x3a4963), nightFactor * 0.72);
      }
      if (lightningFlashIntensity > 0.05) {
        cloudTint.lerp(new THREE.Color(0xdff4ff), Math.min(1, lightningFlashIntensity * 0.6));
      }

      for (const c of clouds) {
        c.mesh.position.x += dt * c.speed * (1.0 + waveIntensity * 1.2);
        if (c.mesh.position.x > 3.55) c.mesh.position.x = -4.35;
        c.mesh.position.y = c.baseY + Math.sin(time * 0.9 + c.phase) * 0.035;
        c.mesh.material.color.copy(cloudTint);
      }

      // 2. Update flapping seagulls
      for (const g of seagulls) {
        const ang = time * g.speed + g.phase;
        const nx = g.centerX + Math.cos(ang) * g.radiusX;
        const nz = g.centerZ + Math.sin(ang * 2.0) * g.radiusZ;
        const ny = g.centerY + Math.sin(ang * 1.5) * 0.08;
        const dx = -Math.sin(ang) * g.radiusX;
        const dz = Math.cos(ang * 2.0) * g.radiusZ * 2.0;
        g.group.position.set(nx, ny, nz);
        g.group.rotation.y = Math.atan2(dx, dz);
        const flap = Math.sin(time * 9.5 + g.phase) * 0.52;
        g.group.userData.wingL.rotation.z = flap;
        g.group.userData.wingR.rotation.z = -flap;
      }

      // 3. Celestial Orb (Sun / Moon arc inside the bottle)
      const dayAngle = ((hour - 6.0) / 12.0) * Math.PI;
      const isDaytime = (hour >= 5.5 && hour <= 18.5);
      const arcAngle = isDaytime ? dayAngle : (((hour < 6 ? hour + 6 : hour - 18) / 12.0) * Math.PI);
      const orbX = -2.4 * Math.cos(arcAngle);
      const orbY = 0.25 + Math.sin(arcAngle) * 1.15;
      celestialGroup.position.set(orbX, Math.max(0.15, orbY), -0.82);

      if (isDaytime) {
        const warmT = Math.pow(1.0 - Math.sin(Math.max(0, Math.min(Math.PI, dayAngle))), 1.6);
        orbCore.material.color.setHex(0xfff5cc).lerp(new THREE.Color(0xff7b38), warmT);
        orbHalo.material.color.setHex(0xffe082).lerp(new THREE.Color(0xff5722), warmT);
        orbHalo.material.opacity = isStorm ? 0.08 : 0.38;
        orbCore.scale.set(1, 1, 1);
      } else {
        orbCore.material.color.setHex(0xe8f4ff);
        orbHalo.material.color.setHex(0x88c4ff);
        orbHalo.material.opacity = isStorm ? 0.08 : 0.28;
        orbCore.scale.set(0.78, 0.78, 0.78);
      }

      // 4. Twinkling Night Stars & Floating Fireflies
      starMat.opacity = Math.max(0.0, (nightFactor - 0.12) * 1.15);
      if (starMat.opacity > 0.01) {
        const sArr = starGeom.attributes.position.array;
        for (let i = 0; i < starCount; i++) {
          const sb = starBase[i];
          if (sb.isWarmFirefly) {
            sArr[i * 3]     = sb.x + Math.sin(time * 1.4 + sb.phase) * 0.14;
            sArr[i * 3 + 1] = sb.y + Math.cos(time * 1.8 + sb.phase) * 0.09;
            sArr[i * 3 + 2] = sb.z + Math.sin(time * 1.1 + sb.phase) * 0.12;
          }
        }
        starGeom.attributes.position.needsUpdate = true;
      }

      // 5. Rain Streaks & Storm Lightning
      rainLines.visible = isRain;
      if (isRain) {
        rainMat.opacity = isStorm ? 0.68 : 0.42;
        const rArr = rainGeom.attributes.position.array;
        const slantX = isStorm ? -0.11 : -0.04;
        const lenY   = isStorm ? 0.26 : 0.19;
        for (let i = 0; i < rainCount; i++) {
          const rd = rainDrops[i];
          rd.y -= dt * rd.speed * (isStorm ? 1.45 : 1.0);
          rd.x += dt * slantX * 8.0;
          if (rd.y < WATER_LEVEL_Y) {
            // Occasional raindrop ripple on the water surface
            if (Math.random() < 0.015) {
              oceanSystem.userData.triggerWaterRipple(rd.x, rd.z);
            }
            rd.y = 1.38;
            rd.x = -4.6 + Math.random() * 8.4;
          }
          rArr[i * 6]     = rd.x;
          rArr[i * 6 + 1] = rd.y;
          rArr[i * 6 + 2] = rd.z;
          rArr[i * 6 + 3] = rd.x + slantX;
          rArr[i * 6 + 4] = rd.y - lenY;
          rArr[i * 6 + 5] = rd.z;
        }
        rainGeom.attributes.position.needsUpdate = true;
      }

      if (isStorm) {
        lightningTimer -= dt;
        if (lightningTimer <= 0) {
          triggerLightningBolt();
          lightningTimer = 2.8 + Math.random() * 4.5;
        }
      }
      if (lightningFlashIntensity > 0) {
        lightningFlashIntensity = Math.max(0, lightningFlashIntensity - dt * 5.5);
        boltMat.opacity = Math.min(1, lightningFlashIntensity);
        if (lightningFlashIntensity <= 0.02) boltMesh.visible = false;
      }

      // 6. Floating Barrels Buoyancy
      for (const b of barrels) {
        const wavePose = sampleOceanPose(b.x, b.z, time + b.phase, waveIntensity, bottleRock);
        if (b.dropping) {
          b.vy -= dt * 4.2;
          b.y += b.vy * dt;
          if (b.y <= wavePose.y) {
            b.y = wavePose.y;
            b.dropping = false;
            oceanSystem.userData.triggerWaterRipple(b.x, b.z);
            spawnSplashParticles(b.x, b.z, 8);
          }
          b.mesh.position.set(b.x, b.y, b.z);
        } else {
          b.mesh.position.set(b.x, wavePose.y - 0.01, b.z);
          b.mesh.rotation.z = wavePose.pitchZ * 1.4 + Math.sin(time * 2.2 + b.phase) * 0.12;
          b.mesh.rotation.x = wavePose.rollX * 1.4 + Math.cos(time * 1.9 + b.phase) * 0.12;
        }
      }

      // 7. Active Projectiles (Cannonballs & Pebbles)
      for (let i = activeProjectiles.length - 1; i >= 0; i--) {
        const p = activeProjectiles[i];
        p.vy += p.gravity * dt;
        p.mesh.position.x += p.vx * dt;
        p.mesh.position.y += p.vy * dt;
        p.mesh.position.z += p.vz * dt;
        const wY = sampleOceanWave(p.mesh.position.x, p.mesh.position.z, time, waveIntensity, bottleRock);
        if (p.mesh.position.y <= wY) {
          oceanSystem.userData.triggerWaterRipple(p.mesh.position.x, p.mesh.position.z);
          spawnSplashParticles(p.mesh.position.x, p.mesh.position.z, p.type === 'cannonball' ? 14 : 7);
          SoundFX.playSplash();
          fxGroup.remove(p.mesh);
          activeProjectiles.splice(i, 1);
        }
      }

      // 8. Leaping Voxel Dolphins
      for (let i = activeDolphins.length - 1; i >= 0; i--) {
        const d = activeDolphins[i];
        d.age += dt;
        if (d.age < 0) continue;
        d.mesh.visible = true;
        const u = d.age / d.duration;
        if (!d.splashedOut) {
          d.splashedOut = true;
          oceanSystem.userData.triggerWaterRipple(d.x, d.z);
          spawnSplashParticles(d.x, d.z, 7);
        }
        const curX = d.x + d.vx * d.age;
        const curZ = d.z + d.vz * d.age;
        const leapArcY = WATER_LEVEL_Y - 0.12 + Math.sin(u * Math.PI) * 0.78;
        d.mesh.position.set(curX, leapArcY, curZ);
        // Pitch nose smoothly along parabolic tangent
        const tangentPitch = Math.cos(u * Math.PI) * 0.85;
        d.mesh.rotation.z = tangentPitch;
        d.mesh.rotation.y = Math.atan2(-d.vz, d.vx);

        if (u >= 0.92 && !d.splashedIn) {
          d.splashedIn = true;
          oceanSystem.userData.triggerWaterRipple(curX, curZ);
          spawnSplashParticles(curX, curZ, 9);
          SoundFX.playSplash();
        }
        if (u >= 1.05) {
          fxGroup.remove(d.mesh);
          activeDolphins.splice(i, 1);
        }
      }

      // 9. Smoke & Splash Droplet Puffs
      for (let i = smokePuffs.length - 1; i >= 0; i--) {
        const sp = smokePuffs[i];
        sp.age += dt;
        sp.vy += sp.gravity * dt;
        sp.mesh.position.x += sp.vx * dt;
        sp.mesh.position.y += sp.vy * dt;
        sp.mesh.position.z += sp.vz * dt;
        const lifeRatio = 1.0 - sp.age / sp.maxAge;
        sp.mesh.material.opacity = Math.max(0, lifeRatio * 0.85);
        const s = 1.0 + sp.age * 0.8;
        sp.mesh.scale.set(s, s, s);
        if (sp.age >= sp.maxAge) {
          fxGroup.remove(sp.mesh);
          smokePuffs.splice(i, 1);
        }
      }

      return { lightningFlashIntensity };
    }

    return {
      fxGroup,
      update,
      fireCannon,
      callDolphins,
      tossBarrel,
      dropPebbleAt
    };
  }

  // Self-contained Web Audio API Procedural Sound Synthesizer
  const SoundFX = (function () {
    let ctx = null;
    let enabled = false;
    let oceanGain = null;

    function initAudio() {
      if (ctx) return;
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      ctx = new AudioCtx();

      // Continuous ocean surf generator
      const bufferSize = ctx.sampleRate * 3;
      const noiseBuffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const output = noiseBuffer.getChannelData(0);
      let lastOut = 0.0;
      for (let i = 0; i < bufferSize; i++) {
        const white = Math.random() * 2 - 1;
        output[i] = (lastOut + (0.02 * white)) / 1.02;
        lastOut = output[i];
        output[i] *= 1.8;
      }
      const whiteNoise = ctx.createBufferSource();
      whiteNoise.buffer = noiseBuffer;
      whiteNoise.loop = true;

      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 380;

      oceanGain = ctx.createGain();
      oceanGain.gain.value = 0.0;

      whiteNoise.connect(filter);
      filter.connect(oceanGain);
      oceanGain.connect(ctx.destination);
      whiteNoise.start(0);
    }

    function setEnabled(flag) {
      enabled = Boolean(flag);
      if (enabled) {
        initAudio();
        if (ctx && ctx.state === 'suspended') ctx.resume();
        if (oceanGain && ctx) oceanGain.gain.setTargetAtTime(0.08, ctx.currentTime, 0.3);
      } else if (oceanGain && ctx) {
        oceanGain.gain.setTargetAtTime(0.0, ctx.currentTime, 0.2);
      }
      return enabled;
    }

    function playCannon() {
      if (!enabled || !ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(135, now);
      osc.frequency.exponentialRampToValueAtTime(28, now + 0.42);
      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.46);
    }

    function playSplash() {
      if (!enabled || !ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, now);
      osc.frequency.exponentialRampToValueAtTime(680, now + 0.14);
      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.17);
    }

    function playDolphin() {
      if (!enabled || !ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(680, now);
      osc.frequency.exponentialRampToValueAtTime(1420, now + 0.18);
      osc.frequency.exponentialRampToValueAtTime(920, now + 0.32);
      gain.gain.setValueAtTime(0.10, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.36);
    }

    function playThunder() {
      if (!enabled || !ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(72, now);
      osc.frequency.exponentialRampToValueAtTime(24, now + 0.9);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.95);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.98);
    }

    return {
      setEnabled,
      isEnabled: () => enabled,
      playCannon,
      playSplash,
      playDolphin,
      playThunder
    };
  })();

  window.createAtmosphereAndFXSystem = createAtmosphereAndFXSystem;
  window.SoundFX = SoundFX;
})();


/**
 * controls-and-ui.js
 * Implements:
 * 1. Smooth Damped OrbitControls supporting desktop mouse drag/wheel zoom & mobile 1-finger touch rotate / 2-finger pinch zoom
 * 2. Direct 3D Raycast interaction on the bottle & water surface (click water to drop a pebble)
 * 3. Camera View Presets framed so the full bottle, cork, hanging tag, and MARIGOLD · 1742 brass plaque sit cleanly above the UI dock
 */
(function () {
  class BottleOrbitControls {
    constructor(camera, domElement, callbacks = {}) {
      this.camera = camera;
      this.domElement = domElement;
      this.callbacks = callbacks;

      this.target = new THREE.Vector3(0.18, -0.56, 0.0);
      this.desiredTarget = new THREE.Vector3(0.18, -0.56, 0.0);

      this.theta = 0.04;
      this.phi   = 1.40;
      this.radius = 13.5;

      this.desiredTheta = 0.04;
      this.desiredPhi   = 1.40;
      this.desiredRadius = 13.5;

      this.minRadius = 4.6;
      this.maxRadius = 19.5;
      this.minPhi = 0.32;
      this.maxPhi = 1.60;

      this.damping = 0.12;
      this.autoOrbit = false;
      this.autoOrbitSpeed = 0.22;

      this._isDragging = false;
      this._dragDistance = 0;
      this._downX = 0;
      this._downY = 0;
      this._prevX = 0;
      this._prevY = 0;
      this._pinchDist = 0;

      this._bindEvents();
      this.update(0.016);
    }

    setPreset(presetName) {
      if (presetName === 'front') {
        this.desiredTarget.set(0.18, -0.56, 0.0);
        this.desiredTheta = 0.04;
        this.desiredPhi   = 1.40;
        this.desiredRadius = 13.5;
      } else if (presetName === 'ship') {
        this.desiredTarget.set(-0.65, -0.05, 0.35);
        this.desiredTheta = 0.28;
        this.desiredPhi   = 1.28;
        this.desiredRadius = 6.2;
      } else if (presetName === 'lighthouse') {
        this.desiredTarget.set(-1.85, 0.15, -0.15);
        this.desiredTheta = -0.32;
        this.desiredPhi   = 1.26;
        this.desiredRadius = 7.4;
      } else if (presetName === 'underwater') {
        this.desiredTarget.set(-0.25, -1.25, 0.25);
        this.desiredTheta = 0.12;
        this.desiredPhi   = 1.52;
        this.desiredRadius = 7.6;
      } else if (presetName === 'neck') {
        this.desiredTarget.set(0.15, -0.45, 0.0);
        this.desiredTheta = 1.12;
        this.desiredPhi   = 1.28;
        this.desiredRadius = 12.6;
      }
    }

    _bindEvents() {
      const el = this.domElement;

      el.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        this._isDragging = true;
        this._dragDistance = 0;
        this._downX = this._prevX = e.clientX;
        this._downY = this._prevY = e.clientY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!this._isDragging) return;
        const dx = e.clientX - this._prevX;
        const dy = e.clientY - this._prevY;
        this._prevX = e.clientX;
        this._prevY = e.clientY;
        this._dragDistance += Math.hypot(dx, dy);

        this.desiredTheta -= dx * 0.0065;
        this.desiredPhi = THREE.MathUtils.clamp(this.desiredPhi - dy * 0.0055, this.minPhi, this.maxPhi);
      });

      window.addEventListener('mouseup', (e) => {
        if (!this._isDragging) return;
        this._isDragging = false;
        if (this._dragDistance < 6 && this.callbacks.onTapCanvas) {
          this.callbacks.onTapCanvas(e.clientX, e.clientY);
        }
      });

      el.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomDelta = e.deltaY * 0.008;
        this.desiredRadius = THREE.MathUtils.clamp(this.desiredRadius + zoomDelta, this.minRadius, this.maxRadius);
      }, { passive: false });

      el.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          this._isDragging = true;
          this._dragDistance = 0;
          this._downX = this._prevX = e.touches[0].clientX;
          this._downY = this._prevY = e.touches[0].clientY;
        } else if (e.touches.length === 2) {
          this._isDragging = false;
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          this._pinchDist = Math.hypot(dx, dy);
        }
      }, { passive: true });

      el.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && this._isDragging) {
          const dx = e.touches[0].clientX - this._prevX;
          const dy = e.touches[0].clientY - this._prevY;
          this._prevX = e.touches[0].clientX;
          this._prevY = e.touches[0].clientY;
          this._dragDistance += Math.hypot(dx, dy);

          this.desiredTheta -= dx * 0.0075;
          this.desiredPhi = THREE.MathUtils.clamp(this.desiredPhi - dy * 0.0065, this.minPhi, this.maxPhi);
        } else if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const dist = Math.hypot(dx, dy);
          if (this._pinchDist > 0) {
            const delta = (this._pinchDist - dist) * 0.032;
            this.desiredRadius = THREE.MathUtils.clamp(this.desiredRadius + delta, this.minRadius, this.maxRadius);
          }
          this._pinchDist = dist;
        }
      }, { passive: true });

      el.addEventListener('touchend', (e) => {
        if (this._isDragging && this._dragDistance < 8 && e.changedTouches.length === 1) {
          if (this.callbacks.onTapCanvas) {
            this.callbacks.onTapCanvas(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
          }
        }
        if (e.touches.length === 0) {
          this._isDragging = false;
          this._pinchDist = 0;
        }
      }, { passive: true });
    }

    update(dt) {
      if (this.autoOrbit && !this._isDragging) {
        this.desiredTheta += dt * this.autoOrbitSpeed;
      }

      this.theta += (this.desiredTheta - this.theta) * this.damping;
      this.phi   += (this.desiredPhi   - this.phi)   * this.damping;
      this.radius += (this.desiredRadius - this.radius) * this.damping;
      this.target.lerp(this.desiredTarget, this.damping);

      this.phi = THREE.MathUtils.clamp(this.phi, this.minPhi, this.maxPhi);
      this.desiredPhi = THREE.MathUtils.clamp(this.desiredPhi, this.minPhi, this.maxPhi);

      const sinPhi = Math.sin(this.phi);
      const cosPhi = Math.cos(this.phi);
      const sinTheta = Math.sin(this.theta);
      const cosTheta = Math.cos(this.theta);

      this.camera.up.set(0, 1, 0);
      this.camera.position.set(
        this.target.x + this.radius * sinPhi * sinTheta,
        this.target.y + this.radius * cosPhi,
        this.target.z + this.radius * sinPhi * cosTheta
      );
      this.camera.lookAt(this.target);
    }
  }

  window.BottleOrbitControls = BottleOrbitControls;
})();


/**
 * main.js
 * Main application controller for the 3D Ship-in-a-Bottle Voxel Miniature World.
 * Coordinates Three.js WebGL rendering, day/night celestial lighting, weather transitions,
 * bottle rocking spring physics, scene switching, raycast water pebble drops, and UI controls.
 */
(function () {
  const state = {
    hour: 11.27,            // 11:16 AM default (matches frame_01 / frame_04)
    autoDayCycle: false,
    weather: 'sunny',       // 'sunny' (CALM), 'rainy' (BREEZE), 'stormy' (SQUALL)
    waveIntensity: 0.42,    // 0.0 to 1.0
    sceneId: 'pirate',      // 'pirate', 'ghost', 'viking', 'oriental'
    bottleRockAngle: 0.0,
    bottleRockVel: 0.0,
    tagSwingAngle: 0.0,
    tagSwingVel: 0.0,
    nightFactor: 0.0,
    stormFactor: 0.0
  };

  let scene, camera, renderer, controls, clock;
  let tabletopMesh, standGroup, bottlePivotGroup, glassBottleGroup, bottleInteriorGroup;
  let currentWorldGroup, oceanSystem, fxSystem;
  let ambientLight, hemiLight, sunDirLight, rimDirLight;
  let lighthouseLight, shipLight, campfireLight;

  function formatHourString(h) {
    const wrapped = ((h % 24) + 24) % 24;
    const hrs = Math.floor(wrapped);
    const mins = Math.floor((wrapped - hrs) * 60);
    return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}`;
  }

  function init() {
    const container = document.getElementById('canvas-container');
    clock = new THREE.Clock();

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1f1916);
    scene.fog = new THREE.FogExp2(0x1f1916, 0.015);

    camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.1, 120);

    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (renderer.shadowMap) {
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    }
    container.appendChild(renderer.domElement);

    // 1. Setup Cinematic Multi-Light Rig
    ambientLight = new THREE.AmbientLight(0xffeedd, 0.42);
    scene.add(ambientLight);

    hemiLight = new THREE.HemisphereLight(0x9be0ff, 0x4a2f1b, 0.52);
    scene.add(hemiLight);

    sunDirLight = new THREE.DirectionalLight(0xfff3d6, 1.15);
    sunDirLight.position.set(4.5, 8.5, 5.2);
    scene.add(sunDirLight);

    rimDirLight = new THREE.DirectionalLight(0x90d5ff, 0.38);
    rimDirLight.position.set(-6.0, 4.0, -5.5);
    scene.add(rimDirLight);

    // Interior warm PointLights (Lighthouse beacon, Ship cabin lanterns, Beach campfire)
    lighthouseLight = new THREE.PointLight(0xffe28a, 0.8, 5.5);
    lighthouseLight.position.set(-3.55, 1.45, -0.22);

    shipLight = new THREE.PointLight(0xffbe55, 0.9, 4.8);
    shipLight.position.set(-0.78, 0.25, 0.42);

    campfireLight = new THREE.PointLight(0xff8826, 0.95, 4.2);
    campfireLight.position.set(2.30, 0.08, 0.34);

    // 2. Tabletop & Wooden Cradle Stand
    tabletopMesh = createTabletopMesh();
    scene.add(tabletopMesh);

    standGroup = createWoodenStandAndPlaque(SCENE_CONFIGS[state.sceneId].plaque);
    scene.add(standGroup);

    // 3. Bottle Pivot Group (rocks when user rocks the bottle!)
    bottlePivotGroup = new THREE.Group();
    scene.add(bottlePivotGroup);

    bottleInteriorGroup = new THREE.Group();
    bottlePivotGroup.add(bottleInteriorGroup);
    bottleInteriorGroup.add(lighthouseLight, shipLight, campfireLight);

    // Build initial miniature world scene
    currentWorldGroup = buildMiniatureSceneWorld(state.sceneId);
    bottleInteriorGroup.add(currentWorldGroup);

    // Build Ocean System inside bottle
    oceanSystem = createBottleOceanSystem();
    bottleInteriorGroup.add(oceanSystem);

    // Build Atmosphere & Interactive FX System
    fxSystem = createAtmosphereAndFXSystem(bottleInteriorGroup, oceanSystem);

    // Build Outer & Inner Glass Bottle + Cork + Rope Collar + Swinging Tag
    glassBottleGroup = createGlassBottleAndCork();
    bottlePivotGroup.add(glassBottleGroup);

    // 4. Setup OrbitControls & Raycast Water Tap
    const raycaster = new THREE.Raycaster();
    const waterPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -WATER_LEVEL_Y);

    controls = new BottleOrbitControls(camera, renderer.domElement, {
      onTapCanvas: (clientX, clientY) => {
        const rect = renderer.domElement.getBoundingClientRect();
        const ndc = new THREE.Vector2(
          ((clientX - rect.left) / rect.width) * 2 - 1,
          -((clientY - rect.top) / rect.height) * 2 + 1
        );
        raycaster.setFromCamera(ndc, camera);
        const hit = raycaster.intersectPlane(waterPlane, new THREE.Vector3());
        if (hit && hit.x >= -4.8 && hit.x <= 4.0 && Math.abs(hit.z) <= 1.65) {
          fxSystem.dropPebbleAt(hit.x, hit.z);
        }
      }
    });

    bindUIControls();
    window.addEventListener('resize', onWindowResize);

    // Expose controller for inspection & testing
    window.bottleApp = {
      state,
      setScene: switchBottleScene,
      setWeather: setWeatherMode,
      setHour: (h) => {
        state.hour = h;
        const slider = document.getElementById('hourSlider');
        const label = document.getElementById('hourDisplay');
        if (slider) slider.value = h;
        if (label) label.textContent = formatHourString(h);
      },
      setWaveIntensity: (w) => {
        state.waveIntensity = w;
        const slider = document.getElementById('waveSlider');
        const label = document.getElementById('waveDisplay');
        if (slider) slider.value = Math.round(w * 100);
        if (label) label.textContent = `${Math.round(w * 100)}%`;
      },
      setCameraPreset: (p) => controls.setPreset(p),
      rockBottle: triggerBottleRock,
      fireCannon: () => fxSystem.fireCannon(currentWorldGroup.userData.shipGroup),
      callDolphins: () => fxSystem.callDolphins(),
      tossBarrel: () => fxSystem.tossBarrel()
    };

    animate();
  }

  function switchBottleScene(sceneId) {
    if (!SCENE_CONFIGS[sceneId]) return;
    state.sceneId = sceneId;
    const cfg = SCENE_CONFIGS[sceneId];

    if (currentWorldGroup) {
      bottleInteriorGroup.remove(currentWorldGroup);
    }
    currentWorldGroup = buildMiniatureSceneWorld(sceneId);
    bottleInteriorGroup.add(currentWorldGroup);

    // Update brass nameplate on wooden stand
    standGroup.userData.setPlaqueText(cfg.plaque);

    // Update water palette & lantern colors
    const u = oceanSystem.userData.uniforms;
    u.uDeepColor.value.setHex(cfg.deepWater);
    u.uShallowColor.value.setHex(cfg.shallowWater);
    u.uFoamColor.value.setHex(cfg.foamColor);

    lighthouseLight.color.setHex(cfg.lanternColors[0]);
    shipLight.color.setHex(cfg.lanternColors[1]);
    campfireLight.color.setHex(cfg.lanternColors[2]);

    // Gentle celebratory rock when switching worlds
    state.bottleRockVel += 0.14;

    document.querySelectorAll('[data-scene]').forEach((btn) => {
      btn.classList.toggle('active', btn.getAttribute('data-scene') === sceneId);
    });
  }

  function setWeatherMode(weather) {
    state.weather = weather;
    if (weather === 'sunny') {
      window.bottleApp.setWaveIntensity(0.35);
    } else if (weather === 'rainy') {
      window.bottleApp.setWaveIntensity(0.58);
    } else if (weather === 'stormy') {
      window.bottleApp.setWaveIntensity(0.88);
      state.bottleRockVel += 0.18;
    }
    document.querySelectorAll('[data-weather]').forEach((btn) => {
      btn.classList.toggle('active', btn.getAttribute('data-weather') === weather);
    });
  }

  function triggerBottleRock() {
    state.bottleRockVel += (Math.random() > 0.5 ? 1 : -1) * 0.36;
    state.tagSwingVel += 0.65;
    SoundFX.playSplash();
  }

  function bindUIControls() {
    const hourSlider = document.getElementById('hourSlider');
    const hourDisplay = document.getElementById('hourDisplay');
    const btnAutoTime = document.getElementById('btnAutoTime');
    const waveSlider = document.getElementById('waveSlider');
    const waveDisplay = document.getElementById('waveDisplay');

    if (hourSlider) {
      hourSlider.addEventListener('input', (e) => {
        state.hour = parseFloat(e.target.value);
        if (hourDisplay) hourDisplay.textContent = formatHourString(state.hour);
      });
    }

    if (btnAutoTime) {
      btnAutoTime.addEventListener('click', () => {
        state.autoDayCycle = !state.autoDayCycle;
        btnAutoTime.classList.toggle('active', state.autoDayCycle);
      });
    }

    if (waveSlider) {
      waveSlider.addEventListener('input', (e) => {
        const val = parseFloat(e.target.value);
        state.waveIntensity = val / 100;
        if (waveDisplay) waveDisplay.textContent = `${Math.round(val)}%`;
      });
    }

    document.querySelectorAll('[data-weather]').forEach((btn) => {
      btn.addEventListener('click', () => setWeatherMode(btn.getAttribute('data-weather')));
    });

    document.querySelectorAll('[data-scene]').forEach((btn) => {
      btn.addEventListener('click', () => switchBottleScene(btn.getAttribute('data-scene')));
    });

    document.querySelectorAll('[data-camera]').forEach((btn) => {
      btn.addEventListener('click', () => {
        controls.setPreset(btn.getAttribute('data-camera'));
        document.querySelectorAll('[data-camera]').forEach((b) => b.classList.toggle('active', b === btn));
      });
    });

    const bindClick = (id, fn) => {
      const el = document.getElementById(id);
      if (el) el.addEventListener('click', fn);
    };

    bindClick('btnFireCannon', () => fxSystem.fireCannon(currentWorldGroup.userData.shipGroup));
    bindClick('btnCallDolphins', () => fxSystem.callDolphins());
    bindClick('btnRockBottle', () => triggerBottleRock());
    bindClick('btnTossBarrel', () => fxSystem.tossBarrel());

    const btnSlowOrbit = document.getElementById('btnSlowOrbit');
    if (btnSlowOrbit) {
      btnSlowOrbit.addEventListener('click', () => {
        controls.autoOrbit = !controls.autoOrbit;
        btnSlowOrbit.classList.toggle('active', controls.autoOrbit);
      });
    }

    const btnAudio = document.getElementById('btnAudio');
    if (btnAudio) {
      btnAudio.addEventListener('click', () => {
        const on = SoundFX.setEnabled(!SoundFX.isEnabled());
        btnAudio.classList.toggle('active', on);
        btnAudio.innerHTML = on
          ? '<span class="txt-long">🔊 海浪音效：開</span><span class="txt-short">🔊 音效</span>'
          : '<span class="txt-long">🔇 海浪音效：關</span><span class="txt-short">🔇 音效</span>';
      });
    }

    const btnToggleUI = document.getElementById('btnToggleUI');
    const uiDock = document.getElementById('ui-dock');
    if (btnToggleUI && uiDock) {
      btnToggleUI.addEventListener('click', () => {
        uiDock.classList.toggle('collapsed');
        btnToggleUI.textContent = uiDock.classList.contains('collapsed') ? '▲ 展開' : '▼ 收合';
      });
    }
  }

  function updateLightingAndCycle(dt, time) {
    if (state.autoDayCycle) {
      state.hour = (state.hour + dt * 1.15) % 24.0;
      const hourSlider = document.getElementById('hourSlider');
      const hourDisplay = document.getElementById('hourDisplay');
      if (hourSlider) hourSlider.value = state.hour.toFixed(2);
      if (hourDisplay) hourDisplay.textContent = formatHourString(state.hour);
    }

    // Compute smooth day/sunset/night weights from state.hour (0..24)
    const h = state.hour;
    // sunElevation: +1 at 12:00 noon, 0 at 6:00 & 18:00, -1 at 0:00 midnight
    const sunAngle = ((h - 6.0) / 12.0) * Math.PI;
    const sunElev = Math.sin(sunAngle);
    const dayFactor = THREE.MathUtils.clamp((sunElev + 0.15) / 1.15, 0.0, 1.0);
    const nightFactor = 1.0 - dayFactor;
    const sunsetFactor = Math.pow(Math.max(0.0, 1.0 - Math.abs(sunElev) * 2.2), 1.5);

    state.nightFactor = nightFactor;
    const targetStorm = state.weather === 'stormy' ? 1.0 : (state.weather === 'rainy' ? 0.45 : 0.0);
    state.stormFactor += (targetStorm - state.stormFactor) * Math.min(1, dt * 3.5);

    // Room backdrop color transition
    const bgDay    = new THREE.Color(0x231d1a);
    const bgSunset = new THREE.Color(0x2a1b18);
    const bgNight  = new THREE.Color(0x0c1018);
    const bgStorm  = new THREE.Color(0x121822);

    const bgCol = bgDay.clone()
      .lerp(bgSunset, sunsetFactor * 0.7)
      .lerp(bgNight, nightFactor)
      .lerp(bgStorm, state.stormFactor * 0.65);

    scene.background.copy(bgCol);
    if (scene.fog) scene.fog.color.copy(bgCol);

    // Directional Sun/Moon Light position & color
    const sunX = -4.5 * Math.cos(sunAngle);
    const sunY = Math.max(1.8, Math.abs(sunElev) * 8.5 + 1.5);
    sunDirLight.position.set(sunX, sunY, 5.2);

    const sunNoonCol   = new THREE.Color(0xfff4dc);
    const sunSunsetCol = new THREE.Color(0xff8442);
    const moonNightCol = new THREE.Color(0x6e9cd6);

    sunDirLight.color.copy(sunNoonCol)
      .lerp(sunSunsetCol, sunsetFactor * 0.85)
      .lerp(moonNightCol, nightFactor);

    const stormDim = 1.0 - state.stormFactor * 0.48;
    sunDirLight.intensity = (0.28 + dayFactor * 0.95) * stormDim;
    ambientLight.intensity = (0.24 + dayFactor * 0.30) * stormDim;
    hemiLight.intensity = (0.28 + dayFactor * 0.36) * stormDim;

    // Warm Interior PointLights (Lighthouse, Ship Cabin, Beach Campfire) glow brightly at dusk/night & storm!
    const lanternBoost = 0.45 + nightFactor * 1.65 + state.stormFactor * 0.45;
    lighthouseLight.intensity = 1.15 * lanternBoost;
    shipLight.intensity = 1.25 * lanternBoost;
    // Flickering beach campfire
    const flicker = 0.85 + 0.28 * Math.sin(time * 11.3) * Math.cos(time * 7.1);
    campfireLight.intensity = 1.20 * lanternBoost * flicker;

    // Update Tabletop Shader uniforms
    const tableU = tabletopMesh.material.uniforms;
    tableU.uSunIntensity.value = dayFactor * stormDim;
    tableU.uNightFactor.value = nightFactor;
    tableU.uLightColor.value.copy(sunDirLight.color);

    // Update Glass Bottle Shader uniforms
    const glassU = glassBottleGroup.userData.glassUniforms;
    glassU.uSunDir.value.copy(sunDirLight.position).normalize();
    glassU.uSunColor.value.copy(sunDirLight.color);
    glassU.uNightFactor.value = nightFactor;

    // Update Ocean Shader uniforms
    const oceanU = oceanSystem.userData.uniforms;
    oceanU.uTime.value = time;
    oceanU.uWaveIntensity.value = state.waveIntensity;
    oceanU.uBottleRock.value = state.bottleRockAngle;
    oceanU.uNightFactor.value = nightFactor;
    oceanU.uStormFactor.value = state.stormFactor;
    oceanU.uSunDir.value.copy(sunDirLight.position).normalize();
    oceanU.uSunColor.value.copy(sunDirLight.color);
    if (currentWorldGroup && currentWorldGroup.userData.shipGroup) {
      oceanU.uShipPos.value.copy(currentWorldGroup.userData.shipGroup.position);
    }
  }

  function updateBottlePhysics(dt, time) {
    // Spring-damper physics for rocking the bottle on its wooden cradle
    const springK = 14.5;
    const damping = 2.6;
    const stormRock = state.stormFactor * Math.sin(time * 2.1) * 0.015;
    const accel = -springK * state.bottleRockAngle - damping * state.bottleRockVel + stormRock;
    state.bottleRockVel += accel * dt;
    state.bottleRockAngle += state.bottleRockVel * dt;

    bottlePivotGroup.rotation.z = state.bottleRockAngle;
    bottlePivotGroup.rotation.x = Math.sin(time * 1.3) * state.bottleRockAngle * 0.35;

    // Pendulum physics for the hanging ivory tag on the bottle neck
    const tagPivot = glassBottleGroup.userData.tagPivot;
    if (tagPivot) {
      const windPush = (0.04 + state.waveIntensity * 0.09) * Math.sin(time * 2.8);
      const tagAccel = -18.0 * state.tagSwingAngle - 3.2 * state.tagSwingVel - state.bottleRockVel * 1.4 + windPush;
      state.tagSwingVel += tagAccel * dt;
      state.tagSwingAngle += state.tagSwingVel * dt;
      tagPivot.rotation.z = state.tagSwingAngle;
      tagPivot.rotation.x = Math.cos(time * 2.1) * 0.06 * (0.4 + state.waveIntensity);
    }
  }

  function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.05);
    const time = clock.elapsedTime;

    updateBottlePhysics(dt, time);
    updateLightingAndCycle(dt, time);

    oceanSystem.userData.updateRipples(dt);

    if (currentWorldGroup && currentWorldGroup.userData.updateSceneDetails) {
      currentWorldGroup.userData.updateSceneDetails(
        time,
        state.waveIntensity,
        state.bottleRockAngle,
        state.nightFactor
      );
    }

    const fxOut = fxSystem.update(dt, time, state);
    if (fxOut && fxOut.lightningFlashIntensity > 0.05) {
      ambientLight.intensity += fxOut.lightningFlashIntensity * 0.85;
      sunDirLight.intensity += fxOut.lightningFlashIntensity * 1.2;
    }

    controls.update(dt);
    renderer.render(scene, camera);
  }

  function onWindowResize() {
    if (!camera || !renderer) return;
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

</script>
</body>
